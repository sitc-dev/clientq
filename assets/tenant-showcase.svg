<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title description">
  <title id="title">Service businesses using ClientQ</title>
  <description id="description">Illustration of a barbershop, wellness clinic, and auto service business surrounding a mobile ClientQ waitlist.</description>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eff6ff"/>
      <stop offset="0.55" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#ecfdf5"/>
    </linearGradient>
    <linearGradient id="phoneHeader" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172554"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#0f172a" flood-opacity=".16"/>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity=".12"/>
    </filter>
  </defs>

  <rect width="1200" height="900" rx="64" fill="url(#background)"/>
  <circle cx="1070" cy="120" r="110" fill="#dbeafe"/>
  <circle cx="115" cy="775" r="135" fill="#d1fae5"/>
  <path d="M0 650C180 560 310 700 500 630s310-50 420 10 195 60 280-10v270H0z" fill="#e2e8f0" opacity=".6"/>

  <g filter="url(#softShadow)" transform="translate(60 95)">
    <rect width="340" height="250" rx="30" fill="#fff"/>
    <rect width="340" height="70" rx="30" fill="#111827"/>
    <path d="M0 42h340v28H0z" fill="#111827"/>
    <path d="M30 70h280l-20 50H50z" fill="#dc2626"/>
    <path d="M75 70h48l-10 50H65zm96 0h48l10 50h-68zm96 0h43l-20 50h-13z" fill="#f8fafc"/>
    <rect x="35" y="125" width="270" height="95" rx="14" fill="#f1f5f9"/>
    <rect x="60" y="145" width="78" height="75" rx="8" fill="#bfdbfe"/>
    <rect x="202" y="145" width="78" height="75" rx="8" fill="#bfdbfe"/>
    <rect x="150" y="138" width="40" height="82" rx="8" fill="#7c2d12"/>
    <circle cx="170" cy="182" r="4" fill="#fbbf24"/>
    <text x="170" y="36" fill="#fff" font-family="Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle">NORTHSIDE BARBER</text>
    <rect x="82" y="232" width="176" height="42" rx="21" fill="#fff"/>
    <text x="170" y="260" fill="#111827" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">Walk-ins welcome</text>
  </g>

  <g filter="url(#softShadow)" transform="translate(800 90)">
    <rect width="330" height="260" rx="30" fill="#fff"/>
    <rect width="330" height="72" rx="30" fill="#047857"/>
    <path d="M0 42h330v30H0z" fill="#047857"/>
    <circle cx="50" cy="36" r="19" fill="#a7f3d0"/>
    <path d="M50 22v28M36 36h28" stroke="#047857" stroke-width="7" stroke-linecap="round"/>
    <text x="88" y="44" fill="#fff" font-family="Arial, sans-serif" font-size="23" font-weight="700">EVERGREEN CARE</text>
    <rect x="30" y="100" width="270" height="130" rx="18" fill="#ecfdf5"/>
    <circle cx="91" cy="155" r="34" fill="#6ee7b7"/>
    <path d="M75 154l12 12 23-29" fill="none" stroke="#065f46" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="143" y="145" fill="#064e3b" font-family="Arial, sans-serif" font-size="21" font-weight="700">Easy check-in</text>
    <text x="143" y="175" fill="#475569" font-family="Arial, sans-serif" font-size="17">Know your place in line</text>
    <rect x="84" y="239" width="162" height="42" rx="21" fill="#fff"/>
    <text x="165" y="267" fill="#047857" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">Wellness clinic</text>
  </g>

  <g filter="url(#softShadow)" transform="translate(760 590)">
    <rect width="360" height="230" rx="30" fill="#fff"/>
    <rect width="360" height="68" rx="30" fill="#c2410c"/>
    <path d="M0 40h360v28H0z" fill="#c2410c"/>
    <text x="180" y="43" fill="#fff" font-family="Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle">SUMMIT AUTO CARE</text>
    <rect x="30" y="96" width="300" height="108" rx="18" fill="#fff7ed"/>
    <path d="M80 165h200l-20-46H111z" fill="#fb923c"/>
    <path d="M128 128h115l12 29H112z" fill="#bae6fd"/>
    <circle cx="125" cy="175" r="22" fill="#334155"/>
    <circle cx="125" cy="175" r="9" fill="#cbd5e1"/>
    <circle cx="245" cy="175" r="22" fill="#334155"/>
    <circle cx="245" cy="175" r="9" fill="#cbd5e1"/>
    <rect x="68" y="214" width="224" height="40" rx="20" fill="#fff"/>
    <text x="180" y="241" fill="#9a3412" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Service without the waiting room</text>
  </g>

  <g filter="url(#shadow)" transform="translate(390 205)">
    <rect width="410" height="590" rx="54" fill="#0f172a"/>
    <rect x="18" y="18" width="374" height="554" rx="40" fill="#fff"/>
    <rect x="132" y="31" width="146" height="24" rx="12" fill="#0f172a"/>
    <path d="M18 58h374v126H18z" fill="url(#phoneHeader)"/>
    <circle cx="205" cy="108" r="29" fill="#fff"/>
    <path d="M191 108h28m-14-14v28" stroke="#2563eb" stroke-width="8" stroke-linecap="round"/>
    <text x="205" y="157" fill="#fff" font-family="Arial, sans-serif" font-size="27" font-weight="700" text-anchor="middle">Join the waitlist</text>
    <text x="50" y="224" fill="#64748b" font-family="Arial, sans-serif" font-size="16" font-weight="700">YOUR NAME</text>
    <rect x="48" y="238" width="314" height="55" rx="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
    <text x="70" y="273" fill="#334155" font-family="Arial, sans-serif" font-size="19">Jamie Carter</text>
    <text x="50" y="329" fill="#64748b" font-family="Arial, sans-serif" font-size="16" font-weight="700">CHOOSE A TEAM MEMBER</text>
    <rect x="48" y="343" width="314" height="55" rx="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
    <text x="70" y="378" fill="#334155" font-family="Arial, sans-serif" font-size="19">First available</text>
    <path d="M330 363l8 8 8-8" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
    <rect x="48" y="430" width="314" height="64" rx="32" fill="#2563eb"/>
    <text x="205" y="470" fill="#fff" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Add me to the queue</text>
    <circle cx="126" cy="529" r="9" fill="#22c55e"/>
    <text x="146" y="536" fill="#475569" font-family="Arial, sans-serif" font-size="17">Live updates from any device</text>
  </g>

  <g transform="translate(122 390)">
    <circle cx="82" cy="82" r="82" fill="#fff" filter="url(#softShadow)"/>
    <circle cx="82" cy="66" r="29" fill="#f2c6a0"/>
    <path d="M48 145c5-40 23-55 34-55s29 15 34 55" fill="#2563eb"/>
    <path d="M56 61c2-25 14-40 28-40 20 0 31 15 29 42-12-5-25-16-31-27-5 13-14 21-26 25z" fill="#1e293b"/>
    <circle cx="70" cy="67" r="3" fill="#1e293b"/>
    <circle cx="94" cy="67" r="3" fill="#1e293b"/>
  </g>

  <g transform="translate(1000 390)">
    <circle cx="70" cy="70" r="70" fill="#fff" filter="url(#softShadow)"/>
    <circle cx="70" cy="55" r="25" fill="#7c4a2f"/>
    <path d="M39 125c4-35 20-48 31-48s27 13 31 48" fill="#059669"/>
    <path d="M44 51c0-22 10-36 26-36 18 0 29 14 27 38-17-2-30-10-38-23-2 10-7 17-15 21z" fill="#111827"/>
    <circle cx="60" cy="57" r="3" fill="#111827"/>
    <circle cx="80" cy="57" r="3" fill="#111827"/>
  </g>
</svg>
